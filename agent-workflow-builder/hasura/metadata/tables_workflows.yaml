table:
  schema: public
  name: workflows

select_permissions:
  - role: user
    permission:
      columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
      filter:
        # any member (owner/editor/viewer) of the org can view its workflows
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id

insert_permissions:
  - role: user
    permission:
      # owner or editor of the target org can create a workflow
      check:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
      columns: [org_id, name, description, is_active, created_by]
      set:
        created_by: x-hasura-User-Id

update_permissions:
  - role: user
    permission:
      columns: [name, description, is_active]
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
      check: null

delete_permissions:
  - role: user
    permission:
      # only an owner may delete a workflow outright
      filter:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }

object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: latest_run
    using:
      manual_configuration:
        remote_table:
          schema: public
          name: workflow_latest_run
        column_mapping:
          id: workflow_id

array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_steps
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_triggers
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_runs
