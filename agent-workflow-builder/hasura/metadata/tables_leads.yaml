table:
  schema: public
  name: leads

select_permissions:
  - role: user
    permission:
      columns: [id, org_id, name, email, source, created_at]
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id

insert_permissions:
  - role: user
    permission:
      check:
        org:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
      columns: [org_id, name, email, source]

object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
