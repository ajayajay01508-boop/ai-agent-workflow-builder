# hasura/metadata/actions.yaml
# Both actions are called by role "user" — Hasura forwards the caller's
# X-Hasura-User-Id in the session variables to the handler, which is the only
# identity the handler trusts (never trust a user_id passed in the body).

actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{ACTIONS_BASE_URL}}/actions/triggerWorkflowRun'
      forward_client_headers: true
      headers:
        - name: x-webhook-secret
          value_from_env: ACTIONS_WEBHOOK_SECRET
      timeout: 120
    permissions:
      - role: user

  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{ACTIONS_BASE_URL}}/actions/approveStep'
      forward_client_headers: true
      headers:
        - name: x-webhook-secret
          value_from_env: ACTIONS_WEBHOOK_SECRET
      timeout: 30
    permissions:
      - role: user

custom_types:
  objects:
    - name: TriggerWorkflowRunOutput
      fields:
        - name: run_id
          type: uuid!
        - name: status
          type: String!
    - name: ApproveStepOutput
      fields:
        - name: step_run_id
          type: uuid!
        - name: status
          type: String!
