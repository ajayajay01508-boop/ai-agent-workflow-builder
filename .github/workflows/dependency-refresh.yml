name: Dependency Lock Refresh

on:
  push:
    branches: [main]
    paths:
      - agent-workflow-builder/frontend/package.json
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only
        working-directory: agent-workflow-builder/frontend
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-workflow-builder/frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh frontend dependency lock [skip ci]"
            git push
          fi
